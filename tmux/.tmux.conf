# Enable pane scrollback with the mouse wheel and mouse-aware application input.
set -g mouse on

# Open the latest copied text: URLs with xdg-open, and paths (file, file:line:col, directory) in VS Code.
# Relative paths resolve against the pane's current directory.
%hidden OPEN_BUFFER='cd #{q:pane_current_path} || exit; t=$(tmux save-buffer -); case $t in *://*) xdg-open "$t" ;; *) code -g "$t" ;; esac >/dev/null 2>&1'
bind O run-shell -b "$OPEN_BUFFER"
bind -T copy-mode o { send -X copy-selection-and-cancel; run-shell -b "$OPEN_BUFFER" }
