# Enable pane scrollback with the mouse wheel and mouse-aware application input.
set -g mouse on

# Close index gaps when a window is closed. This applies to every session in a group, so all wtmux views stay in sync.
set -g renumber-windows on

# Open the latest copied text: URLs with xdg-open (or open on macOS), and paths (file, file:line:col, directory) in VS Code.
# Relative paths resolve against the pane's current directory, and a leading ~ expands to $HOME.
# prefix O (Shift+O) opens the latest buffer, and copy-mode o opens the selection.
%hidden OPEN_BUFFER='cd #{q:pane_current_path} || exit; t=$(tmux save-buffer -); case $t in "~"|"~/"*) t=$HOME${t##?} ;; esac; case $t in *://*) $(command -v xdg-open || echo open) "$t" ;; *) code -g "$t" ;; esac >/dev/null 2>&1'
bind O run-shell -b "$OPEN_BUFFER"
bind -T copy-mode o { send -X copy-selection-and-cancel; run-shell -b "$OPEN_BUFFER" }

# Pass OSC 8 hyperlinks through to VS Code's terminal (xterm.js), which tmux does not detect as hyperlink-capable.
set -as terminal-features ',xterm-256color:hyperlinks'
